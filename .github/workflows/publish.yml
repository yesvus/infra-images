name: Publish image (manual main only)

on:
  workflow_dispatch:
    inputs:
      image:
        description: Select the tested image
        required: true
        type: choice
        options: [arc-runner, arc-opencode, tezgah]

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.image }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor == 'yesvus' && github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.image == 'arc-opencode' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build and smoke without any registry credentials
        env:
          IMAGE: ${{ inputs.image }}
        run: bash scripts/build-smoke.sh "$IMAGE"
      - name: Login only after smoke on reviewed main
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish SHA-tagged image and report digest
        env:
          IMAGE: ${{ inputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          case "$IMAGE" in
            arc-runner|tezgah) arch=arm64 ;;
            arc-opencode) arch=amd64 ;;
            *) exit 2 ;;
          esac
          tag="ghcr.io/yesvus/infra-$IMAGE:$arch-$GITHUB_SHA"
          docker tag "infra-$IMAGE:smoke" "$tag"
          docker push "$tag"
          digest="$(docker buildx imagetools inspect "$tag" | awk '$1 == "Digest:" {print $2; exit}')"
          test -n "$digest"
          echo "Pin: ghcr.io/yesvus/infra-$IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
          echo "No ops deployment or image promotion is performed." >> "$GITHUB_STEP_SUMMARY"
