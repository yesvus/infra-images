name: Verify ARC OpenCode AMD64

on:
  pull_request:
    paths:
      - 'images/arc-opencode/**'
      - 'scripts/build-smoke.sh'
      - '.github/workflows/verify-arc-opencode.yml'
  push:
    branches: [main]
    paths:
      - 'images/arc-opencode/**'
      - 'scripts/build-smoke.sh'
      - '.github/workflows/verify-arc-opencode.yml'

permissions:
  contents: read

concurrency:
  group: verify-arc-opencode-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Native build and isolated smoke
        run: bash scripts/build-smoke.sh arc-opencode
